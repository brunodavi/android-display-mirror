name: Generate APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25.10"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set build info
        run: |
          echo "ndk_version=$(awk -F '"' '/ndkVersion/ {print $2}' app/build.gradle)" >> "$GITHUB_ENV"
          echo "sdk_dir=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle)" >> "$GITHUB_ENV"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Use JDK
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"
          cache: "gradle"

      - name: Use Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: doubletake/doubletake/go.sum

      # NDK side-by-side (~35s de download/instalação por build)
      - name: Cache NDK
        uses: actions/cache@v4
        with:
          path: ${{ env.sdk_dir }}/ndk/${{ env.ndk_version }}
          key: ndk-${{ env.ndk_version }}-${{ runner.os }}

      # AAR do doubletake/gomobile (~1m20s); só roda build.sh se não houver cache
      - name: Cache airplaylib.aar
        uses: actions/cache@v4
        with:
          path: app/libs/airplaylib.aar
          key: airplaylib-go${{ env.GO_VERSION }}-${{ hashFiles('build.sh', 'doubletake/**', 'app/build.gradle') }}

      # build nativo CMake/Sunshine (~6min nos 3 ABIs); ninja reusa os objetos
      - name: Cache native build
        uses: actions/cache@v4
        with:
          path: app/.cxx
          key: cxx-debug-ndk${{ env.ndk_version }}-${{ hashFiles('app/src/main/cpp/**', 'app/build.gradle', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          chmod +x ./build.sh ./gradlew

          if [ -f app/libs/airplaylib.aar ]; then
            echo "airplaylib.aar restored from cache, skipping build.sh"
          else
            ./build.sh
          fi

          # debug já sai assinado com a chave debug do próprio build (instalável)
          ./gradlew assembleDebug --stacktrace

      # release fixa: os assets são substituídos a cada build (mesmo nome de arquivo)
      - name: Publish (GitHub)
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: test-build
          name: "Test build (v${{ env.version }})"
          prerelease: true
          make_latest: false
          body: |
            APK de teste (debug) — atualizado a cada build em main.
            Commit: ${{ env.short_sha }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: app/build/outputs/apk/debug/app-debug.apk
