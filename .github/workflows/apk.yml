name: Generate APK

env:
  main_project_module: app

on:
  push:
    branches:
      - "release/**"
    tags:
      - "v*.*.*"

  workflow_dispatch:
    inputs:
      version:
        description: "v*.*.*"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set TAG
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="${{ inputs.version }}"
          fi

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $VERSION"
            exit 1
          fi

          echo "version=${VERSION#v}" >> "$GITHUB_ENV"

      - name: Use JDK
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"
          cache: "gradle"

      - name: Use Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.10"

      - name: Build
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)

          echo "${{ secrets.STORE }}" | base64 -d > upload.jks
          echo "${{ secrets.LOCAL }}" | base64 -d > local.properties

          chmod +x ./build.sh ./gradlew

          ./build.sh
          ./gradlew assembleRelease bundleRelease --stacktrace

          rm -f upload.jks local.properties

      - name: Check build outputs
        run: |
          OUTPUT_DIR="${{ env.main_project_module }}/build/outputs"

          echo "Searching for APK and AAB files..."

          APK=$(find "$OUTPUT_DIR/apk" -type f -name "*.apk" | head -n 1)
          AAB=$(find "$OUTPUT_DIR/bundle" -type f -name "*.aab" | head -n 1)

          if [[ -z "$APK" ]]; then
            echo "ERROR: No APK found."
            echo "Available files:"
            find "$OUTPUT_DIR" -type f
            exit 1
          fi

          if [[ -z "$AAB" ]]; then
            echo "ERROR: No AAB found."
            echo "Available files:"
            find "$OUTPUT_DIR" -type f
            exit 1
          fi

          echo "APK found: $APK"
          echo "AAB found: $AAB"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "AAB_PATH=$AAB" >> "$GITHUB_ENV"

      - name: Publish (GitHub)
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: v${{ env.version }}
          tag_name: v${{ env.version }}
          files: |
            ${{ env.APK_PATH }}
            ${{ env.AAB_PATH }}
